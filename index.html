<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard" class="page">
        <h1>Dashboard</h1>
        <div class="analysis">
            <div>
                <h2>Budget</h2>
                <p>$<span id="dashboard-budget">0.00</span></p>
            </div>
            <div>
                <h2>Expenses</h2>
                <p>$<span id="dashboard-expenses">0.00</span></p>
            </div>
            <div>
                <h2>Remaining</h2>
                <p>$<span id="dashboard-remaining">0.00</span></p>
            </div>
        </div>
    </div>
    <div id="budget" class="page" style="display: none;">
        <h1>Budget</h1>
        <form id="budget-form">
            <input type="number" id="budget-amount" placeholder="Enter your budget" required>
            <button type="submit">Set Budget</button>
        </form>
    </div>
    <div id="expenses" class="page" style="display: none;">
        <div class="container">
            <h1>Expense Tracker</h1>
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <input type="number" id="expense-amount" placeholder="Amount" required>
                <button type="submit">Add Expense</button>
            </form>
            <table id="expense-table">
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                </tbody>
            </table>
            <h2>Total: $<span id="total-amount">0.00</span></h2>
        </div>
    </div>
    <script src="script.js"></script>
    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#budget">Budget</a>
        <a href="#expenses">Expenses</a>
    </nav>
</body>
</html>
